<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VVCH93SB3C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      gtag('config', 'G-VVCH93SB3C');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado Caracas Rock 2026 - Sandía Producción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Oswald:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gatorade-orange: #ff5000;
            --gatorade-orange-light: #ff7300;
            --gatorade-yellow: #ffc400;
            --sandia-green: #00e676;
            --sandia-red: #ff1744;
            --bg-asphalt: #0b0c0f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            background-color: #14161b;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            min-height: 100vh;
        }

        /* Barra de control para colocar el nombre o imprimir */
        .controls-bar {
            width: 100%;
            max-width: 1120px;
            background: #1c1f26;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #2e3442;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-grow: 1;
        }

        .controls-group label {
            font-weight: 800;
            color: var(--gatorade-orange);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls-group input {
            background: #0d0f13;
            border: 2px solid #363e4f;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            flex-grow: 1;
            max-width: 480px;
            outline: none;
            transition: all 0.2s;
        }

        .controls-group input:focus {
            border-color: var(--gatorade-orange);
            box-shadow: 0 0 12px rgba(255, 80, 0, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, #ff5000, #ff1744);
            color: #fff;
            border: none;
            padding: 11px 24px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 80, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(255, 80, 0, 0.6);
        }

        .btn-secondary {
            background: #2e3442;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #3e4657;
            box-shadow: none;
        }

        /* LIENZO HORIZONTAL LIMPIO Y PROFESIONAL */
        .cert-container {
            width: 1120px;
            height: 680px;
            position: relative;
            background: radial-gradient(circle at 50% 25%, #181c24 0%, #0d0f13 60%, #060709 100%);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 38px 65px;
            box-sizing: border-box;
            border: 3px solid rgba(255, 80, 0, 0.45);
        }

        /* Detalles geométricos de esquina deportivos estilo Gatorade / Sandía */
        .corner-accent {
            position: absolute;
            pointer-events: none;
            z-index: 2;
        }
        .corner-accent.tl {
            top: 0;
            left: 0;
            width: 180px;
            height: 18px;
            background: linear-gradient(90deg, var(--gatorade-orange), var(--gatorade-yellow), transparent);
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
        }
        .corner-accent.tr {
            top: 0;
            right: 0;
            width: 180px;
            height: 18px;
            background: linear-gradient(270deg, var(--sandia-green), transparent);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 15% 100%);
        }
        .corner-accent.bl {
            bottom: 0;
            left: 0;
            width: 180px;
            height: 18px;
            background: linear-gradient(90deg, var(--sandia-red), transparent);
            clip-path: polygon(0 0, 85% 0, 100% 100%, 0 100%);
        }
        .corner-accent.br {
            bottom: 0;
            right: 0;
            width: 180px;
            height: 18px;
            background: linear-gradient(270deg, var(--gatorade-orange), transparent);
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
        }

        /* SECCIÓN SUPERIOR: SANDÍA PRODUCCIÓN EN TODO EL MEDIO */
        .cert-header {
            text-align: center;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sandia-top-logo {
            max-height: 82px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.8));
        }

        .cert-statement {
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d8dde6;
            margin-bottom: 2px;
        }

        .cert-title-huge {
            font-family: 'Oswald', sans-serif;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 30%, #b8c0cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin: 4px 0 2px 0;
            text-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        .cert-title-sub {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--gatorade-orange);
            text-transform: uppercase;
        }

        /* SECCIÓN CENTRAL: NOMBRE DEL ATLETA Y DETALLES */
        .cert-body {
            position: relative;
            z-index: 5;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        /* Línea limpia para el nombre */
        .athlete-slot {
            width: 80%;
            min-height: 58px;
            border-bottom: 3px solid var(--gatorade-orange-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.015);
            border-radius: 6px 6px 0 0;
            box-shadow: 0 4px 15px rgba(255, 80, 0, 0.25);
        }

        .athlete-text {
            font-family: 'Oswald', sans-serif;
            font-size: 40px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 16px rgba(255, 80, 0, 0.5);
            padding: 0 16px;
        }

        .athlete-text.empty {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.2);
        }

        .race-description {
            font-size: 18px;
            font-weight: 500;
            color: #e4e7eb;
            max-width: 880px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .race-highlight {
            font-family: 'Oswald', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gatorade-yellow);
            display: inline-block;
        }

        .motivational-quote {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            font-size: 16px;
            font-weight: 700;
            color: var(--gatorade-orange);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .motivational-quote::before, .motivational-quote::after {
            content: "";
            height: 2px;
            width: 30px;
            background: linear-gradient(90deg, transparent, var(--gatorade-orange));
        }
        .motivational-quote::after {
            background: linear-gradient(90deg, var(--gatorade-orange), transparent);
        }

        /* SECCIÓN INFERIOR: GATORADE CARACAS ROCK A LA IZQUIERDA Y RUNFREE A LA DERECHA */
        .cert-footer {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .footer-logo-left, .footer-logo-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .footer-logo-img {
            max-height: 60px;
            max-width: 220px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
        }

        /* Impresión directa a PDF horizontal */
        @media print {
            body {
                background: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .controls-bar {
                display: none !important;
            }
            .cert-container {
                width: 100vw !important;
                height: 100vh !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                padding: 40px 60px !important;
            }
            @page {
                size: landscape;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Barra de edición rápida y PDF -->
    <div class="controls-bar">
        <div class="controls-group">
            <label for="runnerInput">Nombre del Corredor:</label>
            <input type="text" id="runnerInput" placeholder="Escribe el nombre aquí o déjalo en blanco..." oninput="setAthleteName(this.value)">
            <button class="btn btn-secondary" onclick="clearAthleteName()">Limpiar</button>
        </div>
        <button class="btn" onclick="window.print()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v8H6z"></path></svg>
            Imprimir / Guardar en PDF
        </button>
    </div>

    <!-- CERTIFICADO -->
    <div class="cert-container">
        <!-- Detalles geométricos deportivos en esquinas -->
        <div class="corner-accent tl"></div>
        <div class="corner-accent tr"></div>
        <div class="corner-accent bl"></div>
        <div class="corner-accent br"></div>

        <!-- 1. PARTE SUPERIOR: SANDÍA PRODUCCIÓN EN TODO EL MEDIO -->
        <div class="cert-header">
            <img src="img/sandia_oficial_blanco.png" alt="Sandía Producción" class="sandia-top-logo">
            <div class="cert-statement">OTORGA EL PRESENTE</div>
            <div class="cert-title-huge">CERTIFICADO</div>
            <div class="cert-title-sub">DE PARTICIPACIÓN A:</div>
        </div>

        <!-- 2. MEDIO: NOMBRE DEL CORREDOR Y TEXTO OFICIAL -->
        <div class="cert-body">
            <!-- Línea limpia para el nombre -->
            <div class="athlete-slot">
                <span id="nameSlot" class="athlete-text empty">________________________________________</span>
            </div>

            <p class="race-description">
                Por su destacada participación en la 
                <span class="race-highlight">25ª EDICIÓN GATORADE CCS ROCK 2026</span> 
                en la ciudad de Caracas.
            </p>

            <p class="motivational-quote">
                “Felicidades por tu esfuerzo, disciplina y ser la vibra del asfalto”
            </p>
        </div>

        <!-- 3. PARTE INFERIOR: GATORADE CCS A LA IZQUIERDA Y RUNFREE A LA DERECHA -->
        <div class="cert-footer">
            <!-- Lateral Izquierdo: Gatorade Caracas Rock -->
            <div class="footer-logo-left">
                <img src="img/caracasrock2026.png" alt="Gatorade Caracas Rock 2026" class="footer-logo-img">
            </div>

            <!-- Lateral Derecho: RUNFREE Social Team -->
            <div class="footer-logo-right">
                <img src="img/runfree_oficial_blanco.png" alt="RUNFREE Social Team" class="footer-logo-img">
            </div>
        </div>
    </div>

    <script>
        function setAthleteName(val) {
            const slot = document.getElementById('nameSlot');
            if (val && val.trim() !== '') {
                slot.innerText = val.trim();
                slot.classList.remove('empty');
            } else {
                slot.innerText = '________________________________________';
                slot.classList.add('empty');
            }
        }

        function clearAthleteName() {
            document.getElementById('runnerInput').value = '';
            setAthleteName('');
        }
    </script>
</body>
</html>
