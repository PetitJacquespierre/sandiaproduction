<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandía Productions | Próximamente</title>
  <!-- Tailwind CSS CDN para estilos limpios y rápidos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white overflow-hidden h-screen w-screen relative select-none">

  <!-- Contenedor del Video de Fondo -->
  <div class="absolute inset-0 w-full h-full overflow-hidden z-0">
    <video 
      autoplay 
      loop 
      muted 
      playsinline 
      class="w-full h-full object-cover">
      <source src="img/bienvenida.mp4" type="video/mp4">
      Tu navegador no soporta video HTML5.
    </video>
    <!-- Overlay oscuro con viñeta para legibilidad perfecta -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-black/80"></div>
  </div>

  <!-- Contenido Central / Splash Teaser -->
  <main class="relative z-10 flex flex-col items-center justify-center h-full text-center px-4">
    
    <!-- Tag de categoría deportiva -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-red-500/40 bg-red-500/10 backdrop-blur-md mb-6">
      <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
      <span class="text-xs md:text-sm font-semibold tracking-widest text-red-400 uppercase">Eventos Deportivos & Running</span>
    </div>

    <!-- Título Principal -->
    <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black italic tracking-tighter uppercase mb-4 drop-shadow-2xl">
      Sandía <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-rose-400 to-emerald-400">Productions</span>
    </h1>

    <!-- Subtítulo / Badge Próximamente -->
    <p class="text-lg sm:text-xl md:text-2xl font-bold tracking-widest text-zinc-300 uppercase mb-8">
      Próximamente
    </p>

    <!-- Barra decorativa deportiva -->
    <div class="w-24 h-1.5 bg-gradient-to-r from-red-500 to-emerald-500 rounded-full mb-8"></div>

    <p class="text-sm md:text-base text-zinc-400 max-w-md mx-auto leading-relaxed">
      Estamos preparando la plataforma definitiva para vivir la emoción del asfalto. Muy pronto disponible.
    </p>

  </main>

  <!-- Footer discreto -->
  <footer class="absolute bottom-4 left-0 w-full text-center z-10">
    <p class="text-[11px] text-zinc-500 tracking-wider">
      &copy; <span id="year"></span> Sandía Productions. Todos los derechos reservados.
    </p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
