<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandía Productions | Próximamente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white overflow-hidden h-[100dvh] w-screen relative select-none">

  <!-- Video de Fondo Centrado -->
  <div class="absolute inset-0 w-full h-full overflow-hidden z-0 flex items-center justify-center">
    <video 
      autoplay 
      loop 
      muted 
      playsinline 
      class="w-full h-full object-contain md:object-cover">
      <source src="img/bienvenida.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>
    <!-- Gradiente muy sutil abajo solo para asentar el footer -->
    <div class="absolute inset-0 pointer-events-none bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
  </div>

  <!-- Capa de Interfaz Minimalista -->
  <div class="relative z-10 flex flex-col justify-end h-full p-4 text-center">
    <!-- Copyright discreto al fondo -->
    <footer class="pb-2">
      <p class="text-[11px] text-zinc-500 tracking-wider">
        &copy; 2026 Sandía Productions. Todos los derechos reservados.
      </p>
    </footer>
  </div>

</body>
</html>
