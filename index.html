<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entorno Inactivo | Grow Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050a15; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            max-width: 90%;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 10px 0;
            color: #e62035; /* El rojo que tenías de base */
        }
        p {
            color: #a4b0be;
            font-size: 16px;
            margin: 0 0 25px 0;
            line-height: 1.6;
        }
        .footer {
            font-size: 11px;
            color: #57606f;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Entorno de Desarrollo Inactivo</h1>
        <p>El tiempo de prueba para este proyecto ha expirado<br>o el servidor ha sido liberado temporalmente.</p>
        <div class="footer">Administrado por GROW STUDIO</div>
    </div>
</body>
</html>
