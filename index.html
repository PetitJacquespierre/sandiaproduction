<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandía Productions | Próximamente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white overflow-hidden h-[100dvh] w-screen relative select-none">

  <!-- Video de Fondo Centrado -->
  <div class="absolute inset-0 w-full h-full overflow-hidden z-0 flex items-center justify-center">
    <video 
      autoplay 
      loop 
      muted 
      playsinline 
      class="w-full h-full object-contain md:object-cover">
      <source src="img/bienvenida.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>
    <!-- Gradiente inferior para legibilidad del texto sin tapar el arte central -->
    <div class="absolute inset-0 pointer-events-none bg-gradient-to-t from-black via-black/40 to-transparent"></div>
  </div>

  <!-- Capa de Interfaz y Textos -->
  <div class="relative z-10 flex flex-col justify-between h-full p-6 text-center max-w-lg mx-auto">
    
    <!-- Espacio superior para que el personaje respire -->
    <div class="pt-4"></div>

    <!-- Espacio central libre para el video -->
    <div class="flex-1"></div>

    <!-- Bloque Inferior: Descripción y Derechos Reservados -->
    <footer class="pb-4 flex flex-col items-center gap-4">
      <p class="text-xs sm:text-sm text-zinc-300 font-normal leading-relaxed max-w-xs sm:max-w-sm drop-shadow-md">
        Estamos preparando la plataforma definitiva para vivir la emoción del asfalto. Muy pronto disponible.
      </p>

      <p class="text-[11px] text-zinc-500 tracking-wider drop-shadow-sm">
        &copy; 2026 Sandía Productions. Todos los derechos reservados.
      </p>
    </footer>

  </div>

</body>
</html>
